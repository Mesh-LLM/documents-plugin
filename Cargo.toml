[package]
name = "mesh-documents-plugin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "PDF attachments for Mesh LLM: inline text, local files for agents, or the mesh-docs reading model"

[dependencies]
anyhow = "1"
async-trait = "0.1"
futures = "0.3"
hex = "0.4"
libc = "0.2"
# Pinned to the host-hook PR branch (Mesh-LLM/mesh-llm#3011) until it lands on main.
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "057c3d73ca17730fe0887a4e654c9f4eeef4e001" }
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
