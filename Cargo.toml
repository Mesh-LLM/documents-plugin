[package]
name = "mesh-pdf-plugin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "PDF text extraction for Mesh LLM with Apache Tika (and OCR)"

[dependencies]
anyhow = "1"
base64 = "0.22"
# Tika compiled to a native library with GraalVM (no JVM); its build downloads GraalVM.
extractous = "0.3.0"
hex = "0.4"
# Needs request_transform.v1: draft https://github.com/Mesh-LLM/mesh-llm/pull/3012
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "0f30127b05ea1ebe87bd8a5dac69b2d019a7d913" }
rand = "0.10"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
