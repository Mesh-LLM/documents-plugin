[package]
name = "mesh-pdf-plugin"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "PDF text extraction for Mesh LLM with Apache Tika (and OCR)"

[dependencies]
anyhow = "1"
base64 = "0.22"
hex = "0.4"
# Stock mesh-llm main; no host changes needed.
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "fe87794b667dc7a449e77eaca024e520c06993b0" }
rand = "0.10"
reqwest = { version = "0.13", default-features = false }
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
