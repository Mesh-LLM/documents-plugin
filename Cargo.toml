[package]
name = "mesh-documents-plugin"
version = "0.1.1"
edition = "2024"
license = "Apache-2.0"
description = "Document (PDF) text extraction for Mesh LLM with Apache Tika (and OCR)"

[dependencies]
anyhow = "1"
base64 = "0.22"
# Tika compiled to a native library with GraalVM (no JVM); its build downloads GraalVM.
extractous = "0.3.0"
hex = "0.4"
# Needs request_transform.v1, merged in https://github.com/Mesh-LLM/mesh-llm/pull/3012
mesh-llm-plugin = { git = "https://github.com/Mesh-LLM/mesh-llm.git", rev = "d6660fa36a2d02d85b6843ac3a16d2bb359c5355" }
rand = "0.10"
schemars = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["full"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }

[lints.rust]
unsafe_code = "forbid"
