name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag, for example v0.1.0"
        required: true
        type: string

permissions:
  contents: write

env:
  VERSION: ${{ github.event.inputs.version || github.ref_name }}

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # Ubuntu 22.04 keeps the glibc requirement at 2.35.
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && format('refs/tags/{0}', inputs.version) || github.ref }}

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux build tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y patchelf zlib1g-dev

      - name: MSVC environment (native-image)
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      # Git Bash's coreutils `link` shadows MSVC's link.exe on PATH.
      - name: Remove Git's link.exe
        if: runner.os == 'Windows'
        run: rm -f /usr/bin/link.exe

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2

      - name: Test
        run: cargo test --release --locked

      - name: Package
        run: |
          archive=$(scripts/package.sh "$VERSION" | tail -1)
          test "$(basename "$archive")" = "documents-${VERSION#v}-${{ matrix.target }}.$([[ $archive == *.zip ]] && echo zip || echo tar.gz)"
          echo "archive=$archive" >> "$GITHUB_ENV"

      - name: Smoke-test the archive
        run: scripts/smoke.sh "$archive"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: documents-${{ matrix.target }}
          path: dist/documents-*
          if-no-files-found: error

  publish:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          files: artifacts/*
          fail_on_unmatched_files: true
          overwrite_files: true
